# Weekly dependency PRs. dependabot-automerge.yml merges patch and minor
# bumps once required checks pass; majors wait for the owner.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/London
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
