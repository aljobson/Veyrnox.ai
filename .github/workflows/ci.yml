name: ci

# The gate CLAUDE.md "Testing & CI" promises: build succeeds, tests pass,
# no new `dangerously-` usage, no console.log of a secret, no high/critical
# advisories. Runs on every PR and every push to main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Grep gates
        run: |
          set -euo pipefail
          FIRST_PARTY="app components lib middleware.js packages/db packages/adapters packages/catalog"
          # No new dangerouslySetInnerHTML / dangerously-* outside third-party submodules.
          if git grep -nE 'dangerously' -- $FIRST_PARTY; then
            echo 'dangerously-* usage found in first-party code'; exit 1
          fi
          # Every other way to turn a string into markup or code. The CSP still
          # carries script-src 'unsafe-inline' (next.config.mjs explains why:
          # Next streams un-nonced inline RSC scripts and the pages are
          # statically prerendered, so a per-request nonce is not available).
          # That makes "there is no XSS sink in first-party code" the control
          # that stands between an injection and a stolen session, so it is
          # enforced here rather than left to review.
          if git grep -nE 'innerHTML|outerHTML|insertAdjacentHTML|document\.write|srcdoc|\beval\(|new Function\(|javascript:' -- $FIRST_PARTY; then
            echo 'HTML/code-from-string sink found in first-party code — see next.config.mjs on why the CSP cannot catch it'; exit 1
          fi
          # No logging of a credential-shaped variable. console.error, not
          # console.log, is this codebase's idiom — the money spine logs with
          # it exclusively — so a gate on console.log alone could not fire
          # (audit 2026-09-23).
          if git grep -nE 'console\.(log|error|warn|info|debug)\([^)]*(SECRET|_KEY|TOKEN|PASSWORD|serviceRoleKey|falKey|kieKey|openrouterKey|secretAccessKey)' -- 'app' 'components' 'lib' 'middleware.js' 'packages' 'worker.js'; then
            echo 'a secret-shaped value is logged'; exit 1
          fi

      - name: Migration numbering
        run: ./scripts/check-migration-numbers.sh

      - name: Catalog UPDATE guards
        run: node scripts/check-catalog-update-guards.mjs

      - name: Lint and foundation type check
        run: npm run lint && npm run typecheck

      - name: Client credential boundaries
        run: npm run test:security

      - name: Unit tests
        run: npm test

      # tsx strips types without checking them, so packages/catalog and
      # packages/db were never type-checked anywhere. That is how a Modality
      # union that its own rows violated sat in the file CLAUDE.md calls
      # normative for pricing. Installed ad-hoc, like tsx in ledger-tests.yml,
      # because a root devDependency is the exact shape of the three libraries
      # that break Workers Builds.
      - name: Type check
        run: |
          npm i --no-save --no-audit --no-fund typescript@5
          # Source only. The acceptance tests import `pg`, which
          # ledger-tests.yml installs ad-hoc; type-checking them belongs there.
          npx tsc --noEmit --skipLibCheck --allowImportingTsExtensions \
            --target es2022 --module esnext --moduleResolution bundler \
            --strict false \
            $(ls packages/catalog/*.ts packages/db/*.ts | grep -v '\.test\.ts$')

      - name: Build
        run: npm run build

      - name: Audit (high and above)
        run: npm audit --audit-level=high
