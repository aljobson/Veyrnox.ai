name: dependabot-automerge

# Queues GitHub auto-merge on Dependabot's patch and minor PRs. The merge
# itself still waits for the main-protection ruleset's required checks
# (build-test, guard, verify). The ledger acceptance check is not required
# there, so it does not gate these merges. Majors, and every PR not opened by
# Dependabot, are merged by the owner (decision of 2026-10-02).

on: pull_request

permissions: {}

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'aljobson/Veyrnox.ai'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Enable auto-merge for patch and minor updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
