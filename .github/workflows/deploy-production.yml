name: deploy-production

# One production deploy at a time, newest main wins.
#
# Cloudflare Workers Builds ran a separate build per push to main, in
# parallel, and whichever finished last went live, so an older commit could
# overwrite a newer one (2026-09-13: #148 finished after #152). GitHub merge
# queues are not available on a user-owned repository, so this workflow
# serialises deploys instead:
#   - the concurrency group lets one deploy run; a newer push replaces any
#     pending one, and a running deploy is never cancelled half-way.
#   - each run re-checks that its commit is still main's tip before deploying.
#
# Cutover: once CLOUDFLARE_API_TOKEN is set and a run here has deployed,
# the Cloudflare production branch deploy command becomes
# `npx opennextjs-cloudflare upload` so Workers Builds stops deploying.
# Until the secret exists this job skips, and Workers Builds keeps deploying.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # For a site that is already down. Skips the retained-asset capture and
      # checks (the live site cannot answer them) and does not roll back,
      # because the recorded rollback target is the broken release. Every other
      # protection stays: the ci-green wait (nothing in the repo's rules
      # permits shipping a red commit, so a manual run waits for ci too), the
      # secret binding checks, the new-build smoke test and the workers.dev
      # check.
      force_recovery:
        description: "Recovery deploy for a site that is down: skip retained-asset checks and rollback (ci must still be green)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ci runs on this same push, in parallel. Without this gate the deploy
  # finished first and shipped a red build; recovery was a manual
  # `wrangler rollback` (audit 2026-09-23).
  ci-green:
    runs-on: ubuntu-latest
    # CI may legitimately use its full 30-minute budget when Ubuntu's package
    # mirror is slow, so the deployment gate keeps 15 minutes of headroom.
    timeout-minutes: 45
    permissions:
      actions: read
    steps:
      - name: Wait for ci to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 90); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA" \
              --jq '[.workflow_runs[] | select(.name == "ci")] | sort_by(.run_started_at) | last
                    | "\(.status) \(.conclusion // "pending")"' 2>/dev/null || echo "unknown pending")
            case "$state" in
              "completed success") echo "ci is green for $GITHUB_SHA"; exit 0 ;;
              "completed "*) echo "::error::ci concluded ${state#completed } for $GITHUB_SHA; not deploying"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::no green ci run for $GITHUB_SHA within 45 minutes; not deploying"
          exit 1

  deploy:
    needs: ci-green
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    # CLOUDFLARE_API_TOKEN lives in this environment, which only main may use.
    # A repository secret would reach any workflow a pushed branch adds.
    environment: production
    env:
      APP_ENV: production
      CLOUDFLARE_ACCOUNT_ID: fb18d9f7052afbea5a5e0eae69948af2
      WORKER_NAME: veyrnox-ai
      FORCE_RECOVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.force_recovery && 'true' || 'false' }}
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      # The project token is public and baked into the client bundle. The
      # personal key is build-only and uploads source maps; it never reaches
      # the Worker or browser.
      NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
      NEXT_PUBLIC_POSTHOG_REPLAY_SAMPLE_RATE: ${{ vars.NEXT_PUBLIC_POSTHOG_REPLAY_SAMPLE_RATE }}
      POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
      POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
    # closed, open or unknown; empty when nothing was deployed. A check that
    # crashed counts as unknown, so it cannot go quiet.
    outputs:
      workers_dev: ${{ steps.workers_dev.outputs.state || (steps.workers_dev.outcome == 'failure' && 'unknown') || '' }}
      workers_dev_detail: ${{ steps.workers_dev.outputs.detail }}
      last_good: ${{ steps.lkg.outputs.summary }}
      deployed: ${{ steps.deploy.outcome == 'success' && 'true' || 'false' }}
    steps:
      - name: Skip until the deploy token is configured
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN not set; Workers Builds still deploys main."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 0

      - name: Still main's tip?
        if: env.HAS_TOKEN == 'true'
        id: tip
        run: |
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "::notice::$GITHUB_SHA is no longer main's tip; the newer run deploys."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.HAS_TOKEN == 'true' && steps.tip.outputs.stale != 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Build
        if: env.HAS_TOKEN == 'true' && steps.tip.outputs.stale != 'true'
        run: npm ci --legacy-peer-deps --no-audit --no-fund && npm run build:worker

      # OpenNext's preview-URL skew protection would bypass the Access policy
      # on veyrnox.ai (ADR-0078). Keep a bounded 20-release history in the same
      # private production deployment instead. Together with the current build,
      # the deployed set contains at most 21 releases; current files always win.
      - name: Retain previous Next static assets
        id: retained_static
        if: env.HAS_TOKEN == 'true' && steps.tip.outputs.stale != 'true' && env.FORCE_RECOVERY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          retained=false
          retained_bytes=0
          max_retained_bytes=2147483648
          retention_bootstrap_predecessor=12448acb867057589159f312cf0e7eabb28a3ff0
          successful_deploy_runs=()
          latest_deployed_sha=""
          while IFS=$'\t' read -r previous_run deployed_sha; do
            deployed=$(gh run view "$previous_run" --json jobs \
              --jq '[.jobs[] | select(.name == "deploy" and .conclusion == "success")
                     | .steps[] | select(.name == "Deploy" and .conclusion == "success")] | length')
            if [ "$deployed" -eq 0 ]; then
              continue
            fi
            if [ -z "$latest_deployed_sha" ]; then
              latest_deployed_sha="$deployed_sha"
            fi
            successful_deploy_runs+=("$previous_run")
            if [ "${#successful_deploy_runs[@]}" -eq 20 ]; then
              break
            fi
          # The window must reach past the last real deploy. Most completed runs on
          # main are cancelled, stale-skipped or failed, so 100 runs is about a day
          # of merges: on 2026-10-20 the last real deploy (2026-10-19 04:53) sat at
          # position 106, every run then failed here, and with no new deploy the
          # window could never recover on its own.
          done < <(gh run list --workflow deploy-production.yml --branch main --status completed --limit 300 \
            --json databaseId,headSha --jq '.[] | [.databaseId, .headSha] | @tsv')
          if [ -z "$latest_deployed_sha" ]; then
            echo "::error::Could not identify an earlier successful production deployment."
            exit 1
          fi
          latest_run="${successful_deploy_runs[0]}"
          latest_artifact_size=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$latest_run/artifacts" \
            --jq '[.artifacts[] | select(.name == "production-next-static" and .expired == false)][0].size_in_bytes // empty')
          if [ -z "$latest_artifact_size" ]; then
            if [ "$latest_deployed_sha" = "$retention_bootstrap_predecessor" ]; then
              echo "::notice::Bootstrapping static retention from the approved pre-retention production release."
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::The latest successful production deployment has no retained static artifact; refusing an unprotected cutover."
            exit 1
          fi
          for previous_run in "${successful_deploy_runs[@]}"; do
            artifact_size=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$previous_run/artifacts" \
              --jq '[.artifacts[] | select(.name == "production-next-static" and .expired == false)][0].size_in_bytes // empty')
            if [ -z "$artifact_size" ]; then
              echo "::notice::Run $previous_run has no retained static artifact; skipping it."
              continue
            fi
            retained_bytes=$((retained_bytes + artifact_size))
            if [ "$retained_bytes" -gt "$max_retained_bytes" ]; then
              echo "::error::Retained static artifacts exceed the 2 GiB download budget."
              exit 1
            fi
            gh run download "$previous_run" --name production-next-static --dir "previous-next-static/$previous_run"
            node scripts/retain-next-static.mjs "previous-next-static/$previous_run" .open-next/assets/_next/static
            retained=true
          done
          echo "available=$retained" >> "$GITHUB_OUTPUT"

      # Old references are enforceable only after at least one successful run
      # has archived a complete build. The first retention-enabled deployment
      # establishes that trusted baseline and still receives strict new-build
      # smoke testing below.
      #
      # A live site that is down (every failure a 5xx or unreachable) cannot
      # say what it references, and must not block the deploy that fixes it
      # (2026-10-19: the 500 site failed this step, so the fix never shipped).
      # That case writes a flagged manifest and a warning; any other failure,
      # such as a 404 or a wrong body, still fails the step.
      - name: Record currently referenced production assets
        id: capture
        if: env.HAS_TOKEN == 'true' && steps.tip.outputs.stale != 'true' && steps.retained_static.outputs.available == 'true'
        run: |
          node scripts/check-site-health.mjs --capture-assets previous-build-assets.json --tolerate-server-errors
          if jq -e '.degraded == true' previous-build-assets.json > /dev/null; then
            echo "degraded=true" >> "$GITHUB_OUTPUT"
          fi

      # One switch for the steps below: true when the site was already down
      # (forced, or the capture above found it so). The smoke test then covers
      # the new build only, and there is nothing healthy to roll back to.
      - name: Decide whether this is a recovery deploy
        id: recovery
        if: env.HAS_TOKEN == 'true' && steps.tip.outputs.stale != 'true'
        env:
          CAPTURE_DEGRADED: ${{ steps.capture.outputs.degraded }}
        run: |
          if [ "$FORCE_RECOVERY" = "true" ] || [ "$CAPTURE_DEGRADED" = "true" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "::warning::RECOVERY DEPLOY: production was already unhealthy before $GITHUB_SHA. Retained-asset checks and automatic rollback are skipped; the new build must pass the strict smoke test on its own."
          fi

      # Each run stores only its own files. The bounded download loop above
      # selects the history, so old files cannot be copied forward forever.
      - name: Save this build's Next static assets
        if: env.HAS_TOKEN == 'true' && steps.tip.outputs.stale != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-next-static
          path: .next/static
          if-no-files-found: error
          retention-days: 90

      # The rollback target. The whole deployment is kept, so a gradual
      # split is restored as it was, not collapsed onto one version.
      # One failed read here deployed nothing on 2026-10-09 (a 504 after 55 s,
      # #753), so it is tried up to five times: 1, 2, 4 and 8 s apart, 10 s a
      # try. curl stops trying again once a try fails more than 45 s in, so
      # about a minute at the very worst. Into a file, not a pipe: a try that
      # broke off would leave half an answer in front of the next one.
      - name: Record the live deployment
        if: env.HAS_TOKEN == 'true' && steps.tip.outputs.stale != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -f --no-progress-meter --retry 4 --retry-all-errors --max-time 10 --retry-max-time 45 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o live-deployments.json \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments"
          jq -c '.result.deployments | sort_by(.created_on) | last
                 | {strategy, versions: [.versions[] | {version_id, percentage}]}' live-deployments.json > previous-deployment.json
          jq -e '.versions | length > 0' previous-deployment.json > /dev/null
          echo "Live before this deploy: $(jq -c .versions previous-deployment.json)"

      - name: Record live secret binding names
        if: env.HAS_TOKEN == 'true' && steps.tip.outputs.stale != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-worker-secrets.mjs capture previous-secrets.json

      - name: Deploy
        id: deploy
        if: env.HAS_TOKEN == 'true' && steps.tip.outputs.stale != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx opennextjs-cloudflare deploy

      - name: Verify live secret bindings survived
        id: secret_check
        if: env.HAS_TOKEN == 'true' && steps.tip.outputs.stale != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-worker-secrets.mjs verify previous-secrets.json

      - name: Smoke test the live site with retained assets
        id: smoke_retained
        if: env.HAS_TOKEN == 'true' && steps.tip.outputs.stale != 'true' && steps.retained_static.outputs.available == 'true' && steps.recovery.outputs.active != 'true'
        run: sleep 20 && node scripts/check-site-health.mjs --asset-manifest previous-build-assets.json

      - name: Smoke test the first retention-enabled deploy
        id: smoke_first
        if: env.HAS_TOKEN == 'true' && steps.tip.outputs.stale != 'true' && (steps.retained_static.outputs.available != 'true' || steps.recovery.outputs.active == 'true')
        run: sleep 20 && node scripts/check-site-health.mjs

      # The deploy passed, so the versions live now are known good. Kept as an
      # artifact so a later failed rollback (its target expired, 2026-10-19)
      # can still name the newest release that worked. Best effort: it never
      # fails a deploy that is healthy.
      - name: Record this release as last known-good
        id: last_good
        if: env.HAS_TOKEN == 'true' && steps.tip.outputs.stale != 'true' && success()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -f --no-progress-meter --retry 4 --retry-all-errors --max-time 10 --retry-max-time 45 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o good-deployments.json \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments"
          jq -c --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg at "$(date -u +%FT%TZ)" \
            '.result.deployments | sort_by(.created_on) | last
             | {sha: $sha, run_id: $run, recorded_at: $at, versions: [.versions[] | {version_id, percentage}]}' \
            good-deployments.json > last-good-deployment.json
          jq -e '.versions | length > 0' last-good-deployment.json > /dev/null
          echo "written=true" >> "$GITHUB_OUTPUT"

      - name: Save the last known-good record
        if: steps.last_good.outputs.written == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: last-good-deployment
          path: last-good-deployment.json
          if-no-files-found: error
          retention-days: 90

      # Runs when a smoke test or the secret check failed, before any rollback,
      # so the failure message and the deploy-failure issue can name the newest
      # release that passed.
      - name: Find the last known-good deployment
        id: lkg
        if: failure() && (steps.smoke_retained.outcome == 'failure' || steps.smoke_first.outcome == 'failure' || steps.secret_check.outcome == 'failure')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/last-known-good.sh

      # Rolls back the Worker only. Applied migrations stay applied, which is
      # why migrations must keep working with the previous release.
      # The request is tried up to five times, as the read above is. Each one
      # asks for the recorded versions to be live, so a repeat asks for what is
      # already so. A try cut off at 10 s may still have been applied, which
      # is why a failure here says "may".
      #
      # Skipped for a recovery deploy: the recorded target is the release that
      # was already broken, so "rolling back" would only re-deploy the outage.
      - name: Roll back to the recorded deployment
        if: failure() && steps.recovery.outputs.active != 'true' && (steps.smoke_retained.outcome == 'failure' || steps.smoke_first.outcome == 'failure' || steps.secret_check.outcome == 'failure')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LAST_GOOD: ${{ steps.lkg.outputs.summary }}
        run: |
          jq --arg msg "auto-rollback: production validation failed after $GITHUB_SHA" \
            '. + {annotations: {"workers/message": $msg}}' previous-deployment.json > rollback.json
          if ! curl -f --no-progress-meter --retry 4 --retry-all-errors --max-time 10 --retry-max-time 45 \
            -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            --data @rollback.json \
            -w '\n%{http_code}\n' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments" > rollback-response.txt; then
            code=$(tail -n 1 rollback-response.txt 2>/dev/null || true)
            echo "::error::ROLLBACK FAILED after deploying $GITHUB_SHA (HTTP ${code:-unknown}): production may still be serving it. Roll back by hand to $(jq -c .versions previous-deployment.json)"
            case "$code" in
              4*) echo "::error::HTTP $code means Cloudflare refused the recorded versions, most likely because they expired (2026-10-19: 2a41e9cd). ${LAST_GOOD:-No last known-good record was found.}" ;;
            esac
            exit 1
          fi
          echo "::error::Production validation failed after deploying $GITHUB_SHA; rolled back to $(jq -c .versions previous-deployment.json)"
          node scripts/check-worker-secrets.mjs verify previous-secrets.json
          sleep 20 && node scripts/check-site-health.mjs --allow-nonimmutable-assets

      - name: No rollback in a recovery deploy
        if: failure() && steps.recovery.outputs.active == 'true' && (steps.smoke_retained.outcome == 'failure' || steps.smoke_first.outcome == 'failure' || steps.secret_check.outcome == 'failure')
        env:
          LAST_GOOD: ${{ steps.lkg.outputs.summary }}
        run: |
          echo "::error::Recovery deploy of $GITHUB_SHA failed validation and was NOT rolled back: production was already unhealthy before it, so there is no healthy release recorded to return to. ${LAST_GOOD:-No last known-good record was found.}"
          exit 1

      # wrangler.jsonc keeps this Worker off workers.dev and Preview URLs
      # (ADR-0078), and `wrangler deploy` is the only thing that applies
      # either. This reads both back. It is the last step and cannot fail the
      # job: the release is already live, the smoke test and its rollback have
      # run, and a rollback restores the code, not these two settings. An open
      # or unreadable answer is reported by report-workers-dev below.
      - name: Is the Worker still off workers.dev?
        id: workers_dev
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-workers-dev.mjs

  # One open issue per episode. A later verified green deploy closes the
  # incident below because production has then advanced past the broken commit.
  # A deploy refused because ci is red counts too: the commit is merged but
  # not live, and nothing else would say so (2026-10-03, #448).
  report-failure:
    needs: [ci-green, deploy]
    if: failure() && (needs.ci-green.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open a deploy-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_GREEN: ${{ needs.ci-green.result }}
          LAST_GOOD: ${{ needs.deploy.outputs.last_good }}
        run: |
          if [ "$CI_GREEN" = "failure" ]; then
            title="Production deploy refused — ci is not green at ${GITHUB_SHA:0:7}"
            detail='ci did not pass on this commit, so it was not deployed. Production still runs the previous version. Fix ci on main; the next green commit deploys.'
          else
            title="Production deploy failed — ${GITHUB_SHA:0:7}"
            detail='If the smoke test or secret preservation check failed, the workflow rolled production back to the previously live version, unless the run log says ROLLBACK FAILED; main still holds the failing commit, so fix forward or revert it.'
          fi
          gh label create deploy-failure --color B60205 --description 'Production deploy failed or was rolled back' 2>/dev/null || true
          existing=$(gh issue list --label deploy-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$title: $RUN_URL ${LAST_GOOD:-}"
            exit 0
          fi
          if [ -n "$LAST_GOOD" ]; then
            detail="$detail $LAST_GOOD"
          fi
          printf 'deploy-production did not deploy %s.\n\n%s\n\nRun: %s\n' "$GITHUB_SHA" "$detail" "$RUN_URL" > body.md
          gh issue create --title "$title" --label deploy-failure --body-file body.md

  resolve-failure:
    needs: [deploy, report-failure, report-workers-dev]
    if: >-
      always() && needs.deploy.result == 'success' &&
      needs.deploy.outputs.deployed == 'true' &&
      needs.deploy.outputs.workers_dev == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Close resolved deploy incidents
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for number in $(gh issue list --label deploy-failure --state open --limit 100 --json number --jq '.[].number'); do
            gh issue close "$number" --reason completed \
              --comment "Resolved by verified production deploy ${GITHUB_SHA:0:7}: $RUN_URL"
          done

  # The release is live, but the Worker also answers on workers.dev or on
  # Preview URLs, where the Access application does not apply, or the check
  # could not tell. Not a failed deploy, so the deploy job stays green and
  # this job says so on the same issue. It waits for report-failure so the
  # two cannot each open one.
  report-workers-dev:
    needs: [deploy, report-failure]
    if: always() && (needs.deploy.outputs.workers_dev == 'open' || needs.deploy.outputs.workers_dev == 'unknown')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Say so on the deploy-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATE: ${{ needs.deploy.outputs.workers_dev }}
          DETAIL: ${{ needs.deploy.outputs.workers_dev_detail }}
        run: |
          if [ "$STATE" = "open" ]; then
            title="Production Worker answers outside its own domain after ${GITHUB_SHA:0:7}"
            detail='wrangler.jsonc sets workers_dev and preview_urls to false (ADR-0078), and the deploy did not leave them that way. Check both keys on main, then run deploy-production again. A rollback does not change either setting.'
          else
            title="Could not confirm the production Worker is off workers.dev after ${GITHUB_SHA:0:7}"
            detail='The deploy itself went out. Read the last step of the deploy job, and check the workers.dev route and Preview URLs in the Worker settings by hand.'
          fi
          gh label create deploy-failure --color B60205 --description 'Production deploy failed or was rolled back' 2>/dev/null || true
          existing=$(gh issue list --label deploy-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$title (${DETAIL:-no detail}): $RUN_URL"
            exit 0
          fi
          printf '%s.\n\n%s\n\n%s\n\nRun: %s\n' "$title" "${DETAIL:-no detail}" "$detail" "$RUN_URL" > body.md
          gh issue create --title "$title" --label deploy-failure --body-file body.md
