name: deploy-production

# One production deploy at a time, newest main wins.
#
# Cloudflare Workers Builds ran a separate build per push to main, in
# parallel, and whichever finished last went live, so an older commit could
# overwrite a newer one (2026-09-13: #148 finished after #152). GitHub merge
# queues are not available on a user-owned repository, so this workflow
# serialises deploys instead:
#   - the concurrency group lets one deploy run; a newer push replaces any
#     pending one, and a running deploy is never cancelled half-way.
#   - each run re-checks that its commit is still main's tip before deploying.
#
# Cutover: once CLOUDFLARE_API_TOKEN is set and a run here has deployed,
# the Cloudflare production branch deploy command becomes
# `npx opennextjs-cloudflare upload` so Workers Builds stops deploying.
# Until the secret exists this job skips, and Workers Builds keeps deploying.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ci runs on this same push, in parallel. Without this gate the deploy
  # finished first and shipped a red build; recovery was a manual
  # `wrangler rollback` (audit 2026-09-23).
  ci-green:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
    steps:
      - name: Wait for ci to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 60); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA" \
              --jq '[.workflow_runs[] | select(.name == "ci")] | sort_by(.run_started_at) | last
                    | "\(.status) \(.conclusion // "pending")"' 2>/dev/null || echo "unknown pending")
            case "$state" in
              "completed success") echo "ci is green for $GITHUB_SHA"; exit 0 ;;
              "completed "*) echo "::error::ci concluded ${state#completed } for $GITHUB_SHA; not deploying"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::no green ci run for $GITHUB_SHA within 30 minutes; not deploying"
          exit 1

  deploy:
    needs: ci-green
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # CLOUDFLARE_API_TOKEN lives in this environment, which only main may use.
    # A repository secret would reach any workflow a pushed branch adds.
    environment: production
    env:
      APP_ENV: production
      CLOUDFLARE_ACCOUNT_ID: fb18d9f7052afbea5a5e0eae69948af2
      WORKER_NAME: veyrnox-ai
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    # closed, open or unknown; empty when nothing was deployed. A check that
    # crashed counts as unknown, so it cannot go quiet.
    outputs:
      workers_dev: ${{ steps.workers_dev.outputs.state || (steps.workers_dev.outcome == 'failure' && 'unknown') || '' }}
      workers_dev_detail: ${{ steps.workers_dev.outputs.detail }}
    steps:
      - name: Skip until the deploy token is configured
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN not set; Workers Builds still deploys main."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 0

      - name: Still main's tip?
        if: env.HAS_TOKEN == 'true'
        id: tip
        run: |
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "::notice::$GITHUB_SHA is no longer main's tip; the newer run deploys."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.HAS_TOKEN == 'true' && steps.tip.outputs.stale != 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Build
        if: env.HAS_TOKEN == 'true' && steps.tip.outputs.stale != 'true'
        run: npm ci --legacy-peer-deps --no-audit --no-fund && npm run build:worker

      # The rollback target. The whole deployment is kept, so a gradual
      # split is restored as it was, not collapsed onto one version.
      # One failed read here deployed nothing on 2026-10-09 (a 504 after 55 s,
      # #753), so it is tried up to five times: 1, 2, 4 and 8 s apart, 10 s a
      # try, no new try after 45 s. Into a file, not a pipe: a try that broke
      # off would leave half an answer in front of the next one.
      - name: Record the live deployment
        if: env.HAS_TOKEN == 'true' && steps.tip.outputs.stale != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -f --no-progress-meter --retry 4 --retry-all-errors --max-time 10 --retry-max-time 45 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o live-deployments.json \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments"
          jq -c '.result.deployments | sort_by(.created_on) | last
                 | {strategy, versions: [.versions[] | {version_id, percentage}]}' live-deployments.json > previous-deployment.json
          jq -e '.versions | length > 0' previous-deployment.json > /dev/null
          echo "Live before this deploy: $(jq -c .versions previous-deployment.json)"

      - name: Record live secret binding names
        if: env.HAS_TOKEN == 'true' && steps.tip.outputs.stale != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-worker-secrets.mjs capture previous-secrets.json

      - name: Deploy
        id: deploy
        if: env.HAS_TOKEN == 'true' && steps.tip.outputs.stale != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx opennextjs-cloudflare deploy

      - name: Verify live secret bindings survived
        id: secret_check
        if: env.HAS_TOKEN == 'true' && steps.tip.outputs.stale != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-worker-secrets.mjs verify previous-secrets.json

      - name: Smoke test the live site
        id: smoke
        if: env.HAS_TOKEN == 'true' && steps.tip.outputs.stale != 'true'
        run: sleep 20 && node scripts/check-site-health.mjs

      # Rolls back the Worker only. Applied migrations stay applied, which is
      # why migrations must keep working with the previous release.
      # The request is tried up to five times, as the read above is. Sending
      # it twice is safe: each one makes the recorded versions live again, so
      # a repeat only adds an entry to the deployment history.
      - name: Roll back to the recorded deployment
        if: failure() && (steps.smoke.outcome == 'failure' || steps.secret_check.outcome == 'failure')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          jq --arg msg "auto-rollback: production validation failed after $GITHUB_SHA" \
            '. + {annotations: {"workers/message": $msg}}' previous-deployment.json > rollback.json
          if ! curl -f --no-progress-meter --retry 4 --retry-all-errors --max-time 10 --retry-max-time 45 \
            -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            --data @rollback.json \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments" > /dev/null; then
            echo "::error::ROLLBACK FAILED after deploying $GITHUB_SHA: production may still be serving it. Roll back by hand to $(jq -c .versions previous-deployment.json)"
            exit 1
          fi
          echo "::error::Production validation failed after deploying $GITHUB_SHA; rolled back to $(jq -c .versions previous-deployment.json)"
          node scripts/check-worker-secrets.mjs verify previous-secrets.json
          sleep 20 && node scripts/check-site-health.mjs

      # wrangler.jsonc keeps this Worker off workers.dev and Preview URLs
      # (ADR-0078), and `wrangler deploy` is the only thing that applies
      # either. This reads both back. It is the last step and cannot fail the
      # job: the release is already live, the smoke test and its rollback have
      # run, and a rollback restores the code, not these two settings. An open
      # or unreadable answer is reported by report-workers-dev below.
      - name: Is the Worker still off workers.dev?
        id: workers_dev
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-workers-dev.mjs

  # One open issue per episode; a later green deploy does not close it,
  # because a rollback means main still holds the broken commit.
  # A deploy refused because ci is red counts too: the commit is merged but
  # not live, and nothing else would say so (2026-10-03, #448).
  report-failure:
    needs: [ci-green, deploy]
    if: failure() && (needs.ci-green.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open a deploy-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_GREEN: ${{ needs.ci-green.result }}
        run: |
          if [ "$CI_GREEN" = "failure" ]; then
            title="Production deploy refused — ci is not green at ${GITHUB_SHA:0:7}"
            detail='ci did not pass on this commit, so it was not deployed. Production still runs the previous version. Fix ci on main; the next green commit deploys.'
          else
            title="Production deploy failed — ${GITHUB_SHA:0:7}"
            detail='If the smoke test or secret preservation check failed, production was rolled back automatically to the previously live version; main still holds the failing commit, so fix forward or revert it.'
          fi
          gh label create deploy-failure --color B60205 --description 'Production deploy failed or was rolled back' 2>/dev/null || true
          existing=$(gh issue list --label deploy-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$title: $RUN_URL"
            exit 0
          fi
          printf 'deploy-production did not deploy %s.\n\n%s\n\nRun: %s\n' "$GITHUB_SHA" "$detail" "$RUN_URL" > body.md
          gh issue create --title "$title" --label deploy-failure --body-file body.md

  # The release is live, but the Worker also answers on workers.dev or on
  # Preview URLs, where the Access application does not apply, or the check
  # could not tell. Not a failed deploy, so the deploy job stays green and
  # this job says so on the same issue. It waits for report-failure so the
  # two cannot each open one.
  report-workers-dev:
    needs: [deploy, report-failure]
    if: always() && (needs.deploy.outputs.workers_dev == 'open' || needs.deploy.outputs.workers_dev == 'unknown')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Say so on the deploy-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATE: ${{ needs.deploy.outputs.workers_dev }}
          DETAIL: ${{ needs.deploy.outputs.workers_dev_detail }}
        run: |
          if [ "$STATE" = "open" ]; then
            title="Production Worker answers outside its own domain after ${GITHUB_SHA:0:7}"
            detail='wrangler.jsonc sets workers_dev and preview_urls to false (ADR-0078), and the deploy did not leave them that way. Check both keys on main, then run deploy-production again. A rollback does not change either setting.'
          else
            title="Could not confirm the production Worker is off workers.dev after ${GITHUB_SHA:0:7}"
            detail='The deploy itself went out. Read the last step of the deploy job, and check the workers.dev route and Preview URLs in the Worker settings by hand.'
          fi
          gh label create deploy-failure --color B60205 --description 'Production deploy failed or was rolled back' 2>/dev/null || true
          existing=$(gh issue list --label deploy-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$title (${DETAIL:-no detail}): $RUN_URL"
            exit 0
          fi
          printf '%s.\n\n%s\n\n%s\n\nRun: %s\n' "$title" "${DETAIL:-no detail}" "$detail" "$RUN_URL" > body.md
          gh issue create --title "$title" --label deploy-failure --body-file body.md
