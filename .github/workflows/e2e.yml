name: e2e

# Browser smoke tests of the three journeys against staging: sign up,
# generate, buy (e2e/, docs/product/ISSUES.md I5). Nothing here spends
# money or writes to staging: sign-up stops at the security check, and the
# generation and Top-up POSTs are answered by the test.
#
# Not a required check: it tests the deployed staging Worker, not the PR.
# Daily, plus on demand. Generate and buy skip until the E2E_EMAIL and
# E2E_PASSWORD secrets name a confirmed staging account.

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: e2e
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      # Ad hoc, like tsx in ledger-tests: kept out of package.json so the
      # Workers build never installs it.
      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@1.63.0
          npx playwright install --with-deps chromium
      - name: Run
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test -c e2e/playwright.config.mjs
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
