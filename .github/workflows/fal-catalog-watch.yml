name: fal-catalog-watch

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    # Only main: a workflow_dispatch on another branch would run that
    # branch's copy of the script with this job's secrets.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # Reads through the anon-callable catalog_watch() RPC (migration 0029):
      # no service-role key in Actions for a five-column SELECT.
      - name: Check fal endpoints + provider prices
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set +e
          node scripts/check-fal-catalog.mjs > report.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat report.txt

      - name: Open issue on drift
        if: steps.check.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="fal catalog drift — $(date -u +%Y-%m-%d)"
          existing=$(gh issue list --label fal-drift --state open --json number --jq '.[0].number // empty')
          body=$'The weekly fal catalog watcher found dead endpoints or margin breaches.\n\nFloor pricing (ADR-0014) leaves no headroom, so any fal price rise breaches immediately. A dead endpoint means every generation on that model debits, fails and refunds.\n\n```\n'"$(cat report.txt)"$'\n```\n'
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label fal-drift --body "$body"
          fi
