name: fal-catalog-watch

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    # Only main: a workflow_dispatch on another branch would run that
    # branch's copy of the script with this job's secrets.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Reads through the anon-callable catalog_watch() RPC (migration 0029):
      # no service-role key in Actions for a five-column SELECT.
      - name: Check fal endpoints + provider prices
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Whether a price that moved on fal's page fails the run, and so
          # opens the issue below. 'false' is how the watch has always run:
          # drift is a note in a green run. 'listed' fails on the rows in
          # scripts/lib/fal-unit-rates.mjs; 'all' on every row, which files
          # on noise (see failingCount). Turning it on is the owner's decision.
          FAL_DRIFT_FAILS: 'false'
        run: |
          set +e
          node scripts/check-fal-catalog.mjs > report.txt 2>&1
          catalog=$?
          # Request contracts: fields we send, pins and price-relevant
          # defaults against fal's live schema (lib/modelCapabilities.js).
          echo "" >> report.txt
          node scripts/check-capabilities.mjs >> report.txt 2>&1
          capabilities=$?
          echo "exit=$(( catalog || capabilities ))" >> "$GITHUB_OUTPUT"
          cat report.txt

      - name: Open issue on drift
        if: steps.check.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="fal catalog drift — $(date -u +%Y-%m-%d)"
          # An issue cannot carry a label the repository does not have: the
          # runs of 2026-09-28 and 2026-10-05 had findings to file and died
          # on this, so nothing was filed.
          gh label create fal-drift --color B60205 --description 'fal endpoint, price or request contract out of step with the catalog' 2>/dev/null || true
          existing=$(gh issue list --label fal-drift --state open --json number --jq '.[0].number // empty')
          # printf with double-quoted parts, not $'...': the apostrophe in
          # "fal's" closed that quoting and the step died with a syntax
          # error, so drift has never opened an issue (audit 2026-09-23).
          body=$(printf '%s\n\n%s\n\n```\n%s\n```\n' \
            "The weekly fal catalog watcher found dead endpoints, margin breaches, or request contracts out of step with fal's live schema." \
            "Floor pricing (ADR-0014) leaves no headroom, so any fal price rise breaches immediately. A dead endpoint means every generation on that model debits, fails and refunds." \
            "$(cat report.txt)")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label fal-drift --body "$body"
          fi
