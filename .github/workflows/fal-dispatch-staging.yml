name: fal-dispatch-staging

# Deploy only the isolated consumer, disabled. Application publication and
# live acceptance are a separate step; no shared staging app vars are changed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fal-dispatch-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: fal-dispatch-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: fb18d9f7052afbea5a5e0eae69948af2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the current main revision
        run: |
          git fetch --quiet origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Verify staging credentials and schema without claiming work
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: node scripts/check-fal-dispatch-staging.mjs

      - name: Validate consumer bundle
        run: npx wrangler deploy --config wrangler.fal-dispatch.jsonc --env staging --dry-run

      - name: Deploy disabled staging consumer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx wrangler deploy --config wrangler.fal-dispatch.jsonc --env staging
          --var FAL_DISPATCH_QUEUE_CONSUMER_ENABLED:false
          --var FAL_DISPATCH_SCHEMA_ENABLED:true

      - name: Provision only the staging consumer secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          set -euo pipefail
          node -e 'process.stdout.write(JSON.stringify({SUPABASE_SERVICE_ROLE_KEY: process.env.SUPABASE_SERVICE_ROLE_KEY, FAL_KEY: process.env.FAL_KEY}))' \
            | npx wrangler secret bulk --config wrangler.fal-dispatch.jsonc --env staging

      - name: Verify installed secret names
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler secret list --config wrangler.fal-dispatch.jsonc --env staging
