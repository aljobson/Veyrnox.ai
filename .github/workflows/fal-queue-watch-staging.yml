name: fal-queue-watch-staging

# Both gates stay off until the monitoring credential and alert destination
# have been configured and a manual run has verified delivery.
on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: fal-queue-watch-staging
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main' && vars.FAL_QUEUE_STAGING_WATCH_ENABLED == 'true'
    environment: fal-queue-monitor-staging
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      exit: ${{ steps.check.outputs.exit }}
      report: ${{ steps.check.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - id: check
        name: Read staging queue metrics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_QUEUE_MONITOR_TOKEN }}
        run: |
          set +e
          node scripts/check-fal-queue-health.mjs > "$RUNNER_TEMP/fal-queue-report.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/fal-queue-report.txt"
          cat "$RUNNER_TEMP/fal-queue-report.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          {
            echo 'report<<FAL_QUEUE_REPORT_EOF'
            cat "$RUNNER_TEMP/fal-queue-report.txt"
            echo 'FAL_QUEUE_REPORT_EOF'
          } >> "$GITHUB_OUTPUT"
          exit "$code"

  alert:
    needs: check
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      vars.FAL_QUEUE_STAGING_ISSUES_ENABLED == 'true' &&
      needs.check.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
      - name: Maintain one staging queue incident
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPORT: ${{ needs.check.outputs.report }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create fal-queue-staging --color B60205 --description 'Staging fal queue or monitoring needs attention' --force
          if [ -z "$REPORT" ]; then
            REPORT='Monitoring job failed before it produced a report. Inspect Actions setup and credential availability.'
          fi
          printf '%s\n\n%s\n' 'Staging fal queue health needs attention. Owner: repository owner. Follow docs/operations/fal-queue-health.md.' "$REPORT" > "$RUNNER_TEMP/fal-queue-incident.txt"
          existing=$(gh issue list --label fal-queue-staging --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue view "$existing" --template '{{.body}}' > "$RUNNER_TEMP/fal-queue-existing.txt"
            # The report is fixed diagnostic text and numeric metrics. Compare
            # before updating so identical incidents stay quiet.
            if cmp -s "$RUNNER_TEMP/fal-queue-existing.txt" "$RUNNER_TEMP/fal-queue-incident.txt"; then exit 0; fi
            gh issue edit "$existing" --body-file "$RUNNER_TEMP/fal-queue-incident.txt"
          else
            gh issue create --title 'Staging fal queue health needs attention' --label fal-queue-staging --body-file "$RUNNER_TEMP/fal-queue-incident.txt"
          fi
          printf 'Diagnostic run: %s\n' "$RUN_URL"
