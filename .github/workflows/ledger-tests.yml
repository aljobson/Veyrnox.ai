name: ledger-tests

on:
  pull_request:
    paths:
      - "packages/db/**"
      - "scripts/migrate.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ledger-tests.yml"
  push:
    branches: [main]
    paths:
      - "packages/db/**"
      - "scripts/migrate.mjs"

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veyrnox
          POSTGRES_PASSWORD: veyrnox_dev
          POSTGRES_DB: veyrnox
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U veyrnox -d veyrnox"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=30

    env:
      DATABASE_URL: postgres://veyrnox:veyrnox_dev@localhost:5432/veyrnox

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Isolated install — do NOT pull the whole workspace tree (submodule
      # packages fail without their private origins). pg and tsx are all we
      # need to migrate + run the acceptance tests.
      - name: Install pg + tsx
        run: npm install --no-save --no-audit --no-fund pg@^8.13.0 tsx@^4.19.2

      - name: Apply migrations
        run: node scripts/migrate.mjs

      - name: Run ledger acceptance tests
        run: npx tsx --test packages/db/ledger.acceptance.test.ts
