name: ledger-tests

on:
  pull_request:
    paths:
      - "packages/db/**"
      - "packages/catalog/**"
      - "scripts/migrate.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ledger-tests.yml"
  push:
    branches: [main]
    paths:
      - "packages/db/**"
      - "packages/catalog/**"
      - "scripts/migrate.mjs"

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veyrnox
          POSTGRES_PASSWORD: veyrnox_dev
          POSTGRES_DB: veyrnox
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U veyrnox -d veyrnox"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=30

    env:
      DATABASE_URL: postgres://veyrnox:veyrnox_dev@localhost:5432/veyrnox

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # Isolated install — do NOT pull the whole workspace tree (submodule
      # packages fail without their private origins). pg and tsx are all we
      # need to migrate + run the acceptance tests. Exact pins: CI must not
      # resolve a different package on every run.
      - name: Install pg + tsx
        run: npm install --no-save --no-audit --no-fund pg@8.13.0 tsx@4.19.2

      - name: Run catalog margin-floor tests
        run: npx tsx --test packages/catalog/margin-validator.test.ts

      - name: Apply migrations
        run: node scripts/migrate.mjs

      - name: Run ledger acceptance tests
        run: npx tsx --test packages/db/ledger.acceptance.test.ts
