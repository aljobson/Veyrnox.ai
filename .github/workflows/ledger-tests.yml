name: ledger-tests

on:
  # No paths filter on pull_request: acceptance is a required check, and a
  # workflow that never starts leaves a required check pending forever. The
  # changes job below decides instead; a skipped job counts as passing.
  pull_request:
  push:
    branches: [main]
    paths:
      - "packages/db/**"
      - "packages/catalog/**"
      - "scripts/migrate.mjs"
      - "scripts/test-social-cinema-foundation.mjs"
      - "scripts/test-cinema-creators.mjs"
      - "scripts/test-tenant-foundation.mjs"
      - "scripts/test-project-documents.mjs"
      - "scripts/test-project-assets.mjs"
      - "scripts/test-cinema-content.mjs"
      - "scripts/test-cinema-uploads.mjs"
      - "scripts/test-cinema-upload-recovery.mjs"
      - "scripts/test-cinema-upload-removal.mjs"
      - "scripts/test-cinema-proxy-transfers.mjs"
      - "scripts/test-cinema-operator-actions.mjs"
      - "scripts/test-ledger-backstops.mjs"
      - "scripts/test-default-privileges.mjs"
      - "scripts/test-fk-indexes.mjs"
      - "scripts/test-append-only.mjs"
      - "scripts/test-subscription-credits.mjs"
      - "scripts/test-credit-subscriptions.mjs"
      - "scripts/test-subscription-renewal.mjs"
      - "scripts/test-chat-turns.mjs"
      - "scripts/test-chat-folders.mjs"
      - "scripts/test-free-allowance-jobs.mjs"
      - "scripts/test-chat-research-columns.mjs"
      - "scripts/test-chat-personas.mjs"
      - "scripts/test-popular-templates.mjs"
      - "scripts/test-referral-attribution.mjs"
      - "scripts/test-referral-rewards.mjs"
      # A change to a route that alters RPC arguments could not run these.
      - "app/api/v1/**"
      # Nor could a webhook or an orchestrator, which call credit_top_up,
      # apply_top_up_refund, job_step_* and ledger_refund directly
      # (audit 2026-09-23).
      - "app/api/webhook/**"
      - "lib/**"
      - "worker.js"

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The pull_request paths this workflow used to filter on; every
      # scripts/test-*.mjs counts, since this workflow runs all of them.
      # A push already passed the push paths filter above.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qE \
            '^(packages/db/|packages/catalog/|app/api/v1/|app/api/webhook/|lib/)|^scripts/(migrate|test-[a-z0-9-]+)\.mjs$|^(worker\.js|package\.json|package-lock\.json|\.github/workflows/ledger-tests\.yml)$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No database-affecting files changed; acceptance is skipped."
          fi

  acceptance:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veyrnox
          POSTGRES_PASSWORD: veyrnox_dev
          POSTGRES_DB: veyrnox
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U veyrnox -d veyrnox"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=30

    env:
      DATABASE_URL: postgres://veyrnox:veyrnox_dev@localhost:5432/veyrnox

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Isolated install — do NOT pull the whole workspace tree (submodule
      # packages fail without their private origins). pg and tsx are all we
      # need to migrate + run the acceptance tests. Exact pins: CI must not
      # resolve a different package on every run.
      - name: Install pg + tsx
        run: npm install --no-save --no-audit --no-fund pg@8.13.0 tsx@4.19.2

      # Can this repo still rebuild the database on its own? A missing
      # prerequisite or a migration that depends on an object no file creates
      # was only ever found when apply-migrations hit production (audit
      # 2026-09-23). Its own database, so the acceptance tests below still get
      # the migrate.mjs one.
      - name: Rebuild from scratch
        run: |
          node -e "
            const pg = require('pg');
            (async () => {
              const c = new pg.Client({ connectionString: process.env.DATABASE_URL });
              await c.connect();
              await c.query('DROP DATABASE IF EXISTS rebuild_check');
              await c.query('CREATE DATABASE rebuild_check');
              await c.end();
            })();
          "
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/replay-migrations.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-reconciliation-snapshot.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-recovery-health.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-social-cinema-foundation.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-cinema-creators.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-tenant-foundation.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-project-documents.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-project-assets.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-cinema-content.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-cinema-uploads.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-cinema-upload-recovery.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-cinema-upload-removal.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-cinema-proxy-transfers.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-cinema-unlocks.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-cinema-passes.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-cinema-pass-plays.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-cinema-publication.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-cinema-operator-actions.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-cinema-administrator-provisioning.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-ledger-backstops.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-default-privileges.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-fk-indexes.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-append-only.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-subscription-credits.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-credit-subscriptions.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-subscription-renewal.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-subscription-webhook-ordering.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-chat-turns.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-chat-folders.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-free-allowance-jobs.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-chat-research-columns.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-chat-personas.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-popular-templates.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-referral-attribution.mjs
          DATABASE_URL="${DATABASE_URL%/*}/rebuild_check" node scripts/test-referral-rewards.mjs

      - name: Run catalog margin-floor tests
        run: npx tsx --test packages/catalog/margin-validator.test.ts

      - name: Apply migrations
        run: node scripts/migrate.mjs

      # One file at a time: free-credits applies supabase/0035 to this
      # database, which must not land mid-way through another file's run.
      - name: Run ledger acceptance tests
        run: npx tsx --test --test-concurrency=1 packages/db/*.acceptance.test.ts
