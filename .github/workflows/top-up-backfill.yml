name: top-up-backfill

# Manual run of the Top-up backfill (#94). The Worker does the work at
# POST /api/admin/top-up-backfill. The every-5-minutes run is the Worker's own
# Cron Trigger (wrangler.jsonc, worker.js): this workflow's GitHub schedule
# never fired, so it only runs on demand now.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: top-up-backfill
  cancel-in-progress: false

jobs:
  backfill:
    # Only main: a workflow_dispatch on another branch must not get this
    # job's secret.
    if: github.ref == 'refs/heads/main'
    # TOP_UP_BACKFILL_TOKEN lives in this environment, which only main may
    # use; the `if` above is only as strong as the branch's copy of this file.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the backfill endpoint
        env:
          PUBLIC_HOST: ${{ secrets.PUBLIC_HOST }}
          TOP_UP_BACKFILL_TOKEN: ${{ secrets.TOP_UP_BACKFILL_TOKEN }}
        run: |
          set -euo pipefail
          case "$PUBLIC_HOST" in https://*) ;; *) echo "PUBLIC_HOST secret must be an https origin" >&2; exit 1 ;; esac
          if [ -z "$TOP_UP_BACKFILL_TOKEN" ]; then echo "TOP_UP_BACKFILL_TOKEN secret is not set" >&2; exit 1; fi
          # Header from stdin so the token never appears in the process list.
          printf 'Authorization: Bearer %s\n' "$TOP_UP_BACKFILL_TOKEN" | \
            curl -sS --fail-with-body --max-time 60 -X POST -H @- "${PUBLIC_HOST%/}/api/admin/top-up-backfill"
          echo
