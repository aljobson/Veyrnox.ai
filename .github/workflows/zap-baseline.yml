name: zap-baseline

# Weekly OWASP ZAP baseline scan of STAGING, never production. Baseline is
# passive: it spiders for about a minute and flags missing headers, cookie
# flags and leaked info; it sends no attack payloads. Anonymous only, so it
# cannot reach /app or /api/v1 behind the gate. Warnings (exit 2) do not
# fail the run; a FAIL-level finding (exit 1) does. The HTML/MD reports are
# kept as an artifact. .zap/rules.tsv lists the findings already assessed as
# false positives, each with its reason, so they are not reported again.

on:
  schedule:
    - cron: '43 6 * * 2'
  workflow_dispatch:

permissions: {}

concurrency:
  group: zap-baseline
  cancel-in-progress: false

env:
  TARGET: https://veyrnox-ai-staging.al-jobson.workers.dev

jobs:
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan
        run: |
          mkdir -p zap-wrk && chmod 777 zap-wrk
          # -c is read from /zap/wrk, the mounted working directory.
          cp .zap/rules.tsv zap-wrk/rules.tsv
          set +e
          docker run --rm -v "$PWD/zap-wrk:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "$TARGET" -m 2 -I -c rules.tsv \
            -r zap-report.html -w zap-report.md
          code=$?
          echo "zap exit: $code"
          [ "$code" -le 2 ] && [ "$code" -ne 1 ]

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-baseline-reports
          path: zap-wrk/
          if-no-files-found: ignore
          retention-days: 30
