# Docker Compose for local Veyrnox development.
#
# The site itself runs on Cloudflare Workers (wrangler.jsonc); there is no
# container image of it.
# `postgres` — local Postgres for Phase 1 ledger / catalog / jobs development
#   and acceptance tests. Port 54329 (not default 5432) to avoid clashing with
#   a Postgres a developer already has running.
#
# Usage:
#   docker compose up -d postgres            # just the DB
#   DATABASE_URL=postgres://veyrnox:veyrnox_dev@localhost:54329/veyrnox \
#     node scripts/migrate.mjs               # apply packages/db/schema/*.sql
#   npm run test:ledger                      # run acceptance tests

services:
  postgres:
    image: postgres:16-alpine
    container_name: veyrnox-pg
    environment:
      POSTGRES_USER: veyrnox
      POSTGRES_PASSWORD: veyrnox_dev
      POSTGRES_DB: veyrnox
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - veyrnox_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veyrnox -d veyrnox"]
      interval: 2s
      timeout: 2s
      retries: 30

  clamav:
    image: clamav/clamav:1.4
    # The official 1.4 image is amd64-only. Docker Desktop uses Rosetta/QEMU
    # for this local profile on Apple Silicon; production also runs amd64.
    platform: linux/amd64
    profiles: ["cinema-scanner"]
    volumes:
      - clamav_db:/var/lib/clamav
      - cinema_quarantine:/quarantine:ro
      - ./services/cinema-scanner/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      start_period: 6m
      interval: 30s
      timeout: 10s
      retries: 5

  cinema-scanner:
    build:
      context: .
      dockerfile: services/cinema-scanner/Dockerfile
    profiles: ["cinema-scanner"]
    env_file:
      - path: .env.local
        required: false
    environment:
      CINEMA_QUARANTINE_SCANNER_ENABLED: "true"
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
    volumes:
      - cinema_quarantine:/quarantine
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    depends_on:
      clamav:
        condition: service_healthy
    restart: unless-stopped

volumes:
  veyrnox_pg_data:
  clamav_db:
  cinema_quarantine:
