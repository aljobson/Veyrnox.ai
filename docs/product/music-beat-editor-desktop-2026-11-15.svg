  <g fill="#e8c36a">
    <rect x="380" y="560" width="48" height="22" rx="4"/><rect x="644" y="560" width="48" height="22" rx="4" opacity="0.7"/><rect x="804" y="560" width="48" height="22" rx="4"/><rect x="908" y="560" width="48" height="22" rx="4" opacity="0.6"/>
    <rect x="592" y="590" width="48" height="22" rx="4"/><rect x="1016" y="590" width="48" height="22" rx="4"/>
    <rect x="1172" y="620" width="48" height="22" rx="4" opacity="0.5"/>
    <rect x="380" y="650" width="48" height="22" rx="4" opacity="0.8"/><rect x="484" y="650" width="48" height="22" rx="4" opacity="0.5"/><rect x="592" y="650" width="48" height="22" rx="4" opacity="0.8"/><rect x="696" y="650" width="48" height="22" rx="4" opacity="0.5"/><rect x="804" y="650" width="48" height="22" rx="4" opacity="0.8"/><rect x="908" y="650" width="48" height="22" rx="4" opacity="0.5"/><rect x="1016" y="650" width="48" height="22" rx="4" opacity="0.8"/><rect x="1120" y="650" width="48" height="22" rx="4" opacity="0.5"/>
    <rect x="1120" y="680" width="48" height="22" rx="4" opacity="0.7"/>
    <rect x="380" y="770" width="48" height="22" rx="4"/><rect x="856" y="770" width="48" height="22" rx="4" opacity="0.8"/>
  </g>
  <!-- step playhead -->
  <rect x="694" y="556" width="52" height="240" fill="none" stroke="#ffffff" stroke-width="1.5" rx="6"/>
  <text x="1236" y="574" fill="#66737a" font-size="10">beat 1</text>
