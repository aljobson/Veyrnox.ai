  <line x1="736" y1="92" x2="736" y2="510" stroke="#ffffff" stroke-width="1.5"/>
  <path d="M730 92 L742 92 L736 100 Z" fill="#ffffff"/>

  <!-- Right inspector -->
  <rect x="1040" y="92" width="240" height="418" fill="#11171a" stroke="#222b2f"/>
  <text x="1056" y="118" fill="#eef3f5" font-weight="700">Region · Lo-fi Rhodes</text>
  <g font-size="11" fill="#9aa7ad">
    <text x="1056" y="146">Loop</text><text x="1210" y="146" fill="#6fe0c2">● On</text>
    <text x="1056" y="170">Gain</text><text x="1180" y="170" fill="#eef3f5">−2.0 dB</text>
    <text x="1056" y="194">Fade in / out</text><text x="1180" y="194" fill="#eef3f5">0 / 40 ms</text>
    <text x="1056" y="218">Transpose</text><text x="1180" y="218" fill="#eef3f5">0 st</text>
    <text x="1056" y="242">Follow tempo</text><text x="1210" y="242" fill="#6fe0c2">● On</text>
    <text x="1056" y="266">Reverse</text><text x="1210" y="266" fill="#66737a">○ Off</text>
  </g>
  <line x1="1052" y1="282" x2="1268" y2="282" stroke="#222b2f"/>
  <text x="1056" y="306" fill="#eef3f5" font-weight="700">Track · Keys</text>
  <g font-size="11" fill="#9aa7ad">
    <text x="1056" y="332">EQ</text><text x="1200" y="332" fill="#eef3f5">Warm ▾</text>
    <text x="1056" y="356">Compressor</text><text x="1200" y="356" fill="#eef3f5">Gentle ▾</text>
    <text x="1056" y="380">Reverb send</text><text x="1180" y="380" fill="#eef3f5">▬▬○▬▬</text>
    <text x="1056" y="404">Delay send</text><text x="1180" y="404" fill="#eef3f5">▬○▬▬▬</text>
    <text x="1056" y="428">Automation</text><text x="1200" y="428" fill="#6fe0c2">Show ▾</text>
  </g>

  <!-- Bottom editor: step sequencer -->
  <rect x="272" y="510" width="1008" height="290" fill="#11171a" stroke="#222b2f"/>
  <rect x="284" y="520" width="104" height="26" rx="13" fill="#1e3a33"/><text x="296" y="537" fill="#6fe0c2" font-size="11">Step sequencer</text>
  <text x="404" y="537" fill="#9aa7ad" font-size="11">Piano roll</text>
  <text x="484" y="537" fill="#9aa7ad" font-size="11">Audio editor</text>
  <text x="600" y="537" fill="#eef3f5" font-size="11">Beat A · 1 bar · 16 steps</text>
  <text x="900" y="537" fill="#9aa7ad" font-size="11">Swing 12%   Steps 16 ▾   Velocity ▾</text>
  <g font-size="11" fill="#9aa7ad">
    <text x="284" y="574">Kick</text><text x="284" y="604">Snare</text><text x="284" y="634">Clap</text><text x="284" y="664">Closed hat</text><text x="284" y="694">Open hat</text><text x="284" y="724">Perc</text><text x="284" y="754">Rim</text><text x="284" y="784">808</text>
  </g>
  <!-- 16x8 grid -->
  <g id="grid">
    <g fill="#1a2226" stroke="#222b2f">
      <rect x="380" y="560" width="48" height="22" rx="4"/><rect x="432" y="560" width="48" height="22" rx="4"/><rect x="484" y="560" width="48" height="22" rx="4"/><rect x="536" y="560" width="48" height="22" rx="4"/>
      <rect x="592" y="560" width="48" height="22" rx="4"/><rect x="644" y="560" width="48" height="22" rx="4"/><rect x="696" y="560" width="48" height="22" rx="4"/><rect x="748" y="560" width="48" height="22" rx="4"/>
      <rect x="804" y="560" width="48" height="22" rx="4"/><rect x="856" y="560" width="48" height="22" rx="4"/><rect x="908" y="560" width="48" height="22" rx="4"/><rect x="960" y="560" width="48" height="22" rx="4"/>
      <rect x="1016" y="560" width="48" height="22" rx="4"/><rect x="1068" y="560" width="48" height="22" rx="4"/><rect x="1120" y="560" width="48" height="22" rx="4"/><rect x="1172" y="560" width="48" height="22" rx="4"/>
    </g>
  </g>
  <use href="#grid" y="30"/><use href="#grid" y="60"/><use href="#grid" y="90"/><use href="#grid" y="120"/><use href="#grid" y="150"/><use href="#grid" y="180"/><use href="#grid" y="210"/>
