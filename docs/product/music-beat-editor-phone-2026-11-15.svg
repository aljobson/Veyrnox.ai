<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 900" width="860" height="900" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12">
  <title>Veyrnox Music beat editor: phone sketch (390 x 844)</title>
  <desc>Two phone states. Left: Tracks view with compact headers and the library as a bottom sheet. Right: a drum region opened in the full-height step sequencer, one bar at a time.</desc>
  <rect width="860" height="900" fill="#e9eef0"/>

  <!-- ============ Phone 1: tracks + library sheet ============ -->
  <g transform="translate(20,28)">
    <rect width="390" height="844" rx="44" fill="#0d1113" stroke="#0a0a0a" stroke-width="6"/>
    <text x="20" y="40" fill="#9aa7ad">9:41</text>
    <!-- top bar -->
    <text x="20" y="78" fill="#9aa7ad">←</text>
    <text x="44" y="78" fill="#eef3f5" font-weight="700" font-size="15">Night Drive</text>
    <text x="44" y="94" fill="#6fe0c2" font-size="10">Saved</text>
    <text x="268" y="80" fill="#eef3f5">↶  ↷</text>
    <rect x="316" y="62" width="58" height="28" rx="14" fill="#6fe0c2"/><text x="326" y="81" fill="#0d1113" font-weight="700">Export</text>
    <!-- transport -->
    <rect x="12" y="106" width="366" height="52" rx="14" fill="#151b1e"/>
    <circle cx="40" cy="132" r="18" fill="#6fe0c2"/><text x="35" y="137" fill="#0d1113">▶</text>
    <circle cx="84" cy="132" r="16" fill="none" stroke="#ff6b6b"/><circle cx="84" cy="132" r="6" fill="#ff6b6b"/>
    <text x="112" y="130" fill="#eef3f5" font-family="JetBrains Mono, monospace">5.3.1</text>
    <text x="112" y="146" fill="#66737a" font-size="10">92 BPM · Fm</text>
    <rect x="206" y="118" width="52" height="28" rx="10" fill="#1e3a33"/><text x="215" y="137" fill="#6fe0c2" font-size="11">Cycle</text>
    <rect x="264" y="118" width="44" height="28" rx="10" fill="none" stroke="#2a3439"/><text x="276" y="137" fill="#eef3f5" font-size="11">♩</text>
    <rect x="314" y="118" width="52" height="28" rx="10" fill="none" stroke="#2a3439"/><text x="322" y="137" fill="#eef3f5" font-size="11">Mixer</text>
    <!-- ruler -->
    <rect x="12" y="168" width="366" height="20" fill="#11171a"/>
    <rect x="132" y="168" width="120" height="6" fill="#e8c36a" opacity="0.8"/>
    <g fill="#66737a" font-family="JetBrains Mono, monospace" font-size="10"><text x="76" y="184">1</text><text x="136" y="184">2</text><text x="196" y="184">3</text><text x="256" y="184">4</text><text x="316" y="184">5</text></g>
    <!-- tracks: compact 60px headers -->
    <g font-size="10">
      <rect x="12" y="192" width="60" height="64" fill="#151b1e"/><rect x="12" y="192" width="4" height="64" fill="#e8c36a"/><text x="22" y="214" fill="#eef3f5" font-weight="700">Drums</text><text x="22" y="244" fill="#9aa7ad">M S</text>
      <rect x="74" y="198" width="118" height="52" rx="6" fill="#3a3220" stroke="#e8c36a"/><text x="80" y="212" fill="#e8c36a">Beat A</text>
      <rect x="194" y="198" width="118" height="52" rx="6" fill="#3a3220" stroke="#e8c36a" stroke-dasharray="3 3"/><text x="200" y="212" fill="#e8c36a">↻</text>

      <rect x="12" y="258" width="60" height="64" fill="#151b1e"/><rect x="12" y="258" width="4" height="64" fill="#8fa8ff"/><text x="22" y="280" fill="#eef3f5" font-weight="700">Bass</text><text x="22" y="310" fill="#9aa7ad">M S</text>
      <rect x="134" y="264" width="240" height="52" rx="6" fill="#202a45" stroke="#8fa8ff"/><text x="140" y="278" fill="#8fa8ff">Sub Bass Walk</text>

      <rect x="12" y="324" width="60" height="64" fill="#1a2328" stroke="#6fe0c2"/><rect x="12" y="324" width="4" height="64" fill="#6fe0c2"/><text x="22" y="346" fill="#eef3f5" font-weight="700">Keys</text><text x="22" y="376" fill="#9aa7ad">M S</text>
      <rect x="74" y="330" width="238" height="52" rx="6" fill="#1b3c35" stroke="#6fe0c2" stroke-width="2"/><text x="80" y="344" fill="#6fe0c2">Lo-fi Rhodes</text>
    </g>
    <line x1="232" y1="168" x2="232" y2="392" stroke="#ffffff" stroke-width="1.5"/>
    <!-- selection action bar -->
    <rect x="12" y="398" width="366" height="44" rx="14" fill="#151b1e"/>
    <g font-size="11" fill="#eef3f5"><text x="26" y="425">Split</text><text x="80" y="425">Loop</text><text x="134" y="425">Copy</text><text x="188" y="425">Trim</text><text x="240" y="425">Fade</text><text x="292" y="425" fill="#ff8f8f">Delete</text></g>
    <!-- add track -->
    <text x="20" y="470" fill="#6fe0c2">+ Track</text>

    <!-- library bottom sheet -->
    <rect x="0" y="494" width="390" height="350" rx="28" fill="#151b1e"/>
    <rect x="171" y="504" width="48" height="5" rx="3" fill="#3a464c"/>
    <text x="20" y="536" fill="#eef3f5" font-weight="700" font-size="15">Library</text>
    <rect x="16" y="548" width="358" height="32" rx="16" fill="#0a0e10"/>
    <rect x="18" y="550" width="74" height="28" rx="14" fill="#1e3a33"/><text x="32" y="569" fill="#6fe0c2" font-size="11">Sounds</text>
    <text x="104" y="569" fill="#9aa7ad" font-size="11">Instruments</text><text x="190" y="569" fill="#9aa7ad" font-size="11">Mine</text><text x="238" y="569" fill="#9aa7ad" font-size="11">✦ Generate</text>
    <g font-size="11">
      <rect x="16" y="592" width="358" height="52" rx="12" fill="#0d1113"/><circle cx="42" cy="618" r="14" fill="none" stroke="#6fe0c2"/><text x="37" y="622" fill="#6fe0c2">▶</text><text x="66" y="614" fill="#eef3f5">Dusty Boom Bap Kit</text><text x="66" y="632" fill="#66737a">Kit · 16 pads</text><rect x="318" y="604" width="44" height="28" rx="14" fill="none" stroke="#6fe0c2"/><text x="334" y="623" fill="#6fe0c2">+</text>
      <rect x="16" y="650" width="358" height="52" rx="12" fill="#0d1113"/><circle cx="42" cy="676" r="14" fill="none" stroke="#6fe0c2"/><text x="37" y="680" fill="#6fe0c2">▶</text><text x="66" y="672" fill="#eef3f5">Lo-fi Rhodes Chords</text><text x="66" y="690" fill="#66737a">Loop · 4 bars · Fm</text><rect x="318" y="662" width="44" height="28" rx="14" fill="none" stroke="#6fe0c2"/><text x="334" y="681" fill="#6fe0c2">+</text>
      <rect x="16" y="708" width="358" height="52" rx="12" fill="#0d1113"/><circle cx="42" cy="734" r="14" fill="none" stroke="#6fe0c2"/><text x="37" y="738" fill="#6fe0c2">▶</text><text x="66" y="730" fill="#eef3f5">Sub Bass Walk</text><text x="66" y="748" fill="#66737a">MIDI loop · 2 bars</text><rect x="318" y="720" width="44" height="28" rx="14" fill="none" stroke="#6fe0c2"/><text x="334" y="739" fill="#6fe0c2">+</text>
    </g>
    <text x="20" y="790" fill="#66737a" font-size="10">“+” adds at the playhead on the selected track.</text>
    <text x="20" y="806" fill="#66737a" font-size="10">Long-press and drag to place it yourself.</text>
  </g>
  <text x="20" y="890" fill="#2a3439" font-size="12">Tracks view, library sheet half open</text>

  <!-- ============ Phone 2: step sequencer full height ============ -->
  <g transform="translate(450,28)">
    <rect width="390" height="844" rx="44" fill="#0d1113" stroke="#0a0a0a" stroke-width="6"/>
    <text x="20" y="40" fill="#9aa7ad">9:41</text>
    <text x="20" y="78" fill="#9aa7ad">✕</text>
    <text x="44" y="78" fill="#eef3f5" font-weight="700" font-size="15">Beat A</text>
    <text x="44" y="94" fill="#66737a" font-size="10">Drums · Boom Bap Kit</text>
    <rect x="300" y="62" width="74" height="28" rx="14" fill="#6fe0c2"/><text x="320" y="81" fill="#0d1113" font-weight="700">Done</text>
    <!-- mini transport -->
    <rect x="12" y="106" width="366" height="48" rx="14" fill="#151b1e"/>
    <circle cx="38" cy="130" r="16" fill="#6fe0c2"/><text x="33" y="135" fill="#0d1113">▶</text>
    <text x="66" y="134" fill="#eef3f5" font-size="11">Bar 1 of 2</text>
    <text x="150" y="134" fill="#9aa7ad" font-size="11">‹  ›</text>
    <text x="200" y="134" fill="#9aa7ad" font-size="11">Swing 12%</text>
    <text x="290" y="134" fill="#9aa7ad" font-size="11">16 steps ▾</text>
    <!-- grid 8 rows x 8 visible steps (half bar per page, swipe) -->
    <g font-size="10" fill="#9aa7ad">
      <text x="16" y="200">Kick</text><text x="16" y="256">Snare</text><text x="16" y="312">Clap</text><text x="16" y="368">C hat</text><text x="16" y="424">O hat</text><text x="16" y="480">Perc</text><text x="16" y="536">Rim</text><text x="16" y="592">808</text>
    </g>
    <g id="prow">
      <g fill="#1a2226" stroke="#222b2f">
        <rect x="62" y="176" width="36" height="44" rx="6"/><rect x="102" y="176" width="36" height="44" rx="6"/><rect x="142" y="176" width="36" height="44" rx="6"/><rect x="182" y="176" width="36" height="44" rx="6"/>
        <rect x="226" y="176" width="36" height="44" rx="6"/><rect x="266" y="176" width="36" height="44" rx="6"/><rect x="306" y="176" width="36" height="44" rx="6"/><rect x="346" y="176" width="28" height="44" rx="6"/>
      </g>
    </g>
    <use href="#prow" y="56"/><use href="#prow" y="112"/><use href="#prow" y="168"/><use href="#prow" y="224"/><use href="#prow" y="280"/><use href="#prow" y="336"/><use href="#prow" y="392"/>
    <g fill="#e8c36a">
      <rect x="62" y="176" width="36" height="44" rx="6"/><rect x="266" y="176" width="36" height="44" rx="6" opacity="0.7"/>
      <rect x="226" y="232" width="36" height="44" rx="6"/>
      <rect x="62" y="344" width="36" height="44" rx="6" opacity="0.8"/><rect x="142" y="344" width="36" height="44" rx="6" opacity="0.5"/><rect x="226" y="344" width="36" height="44" rx="6" opacity="0.8"/><rect x="306" y="344" width="36" height="44" rx="6" opacity="0.5"/>
      <rect x="62" y="568" width="36" height="44" rx="6"/>
    </g>
    <text x="62" y="636" fill="#66737a" font-size="10">Steps 1–8 · swipe for 9–16 · long-press a step for velocity</text>
    <!-- pads -->
    <text x="20" y="668" fill="#eef3f5" font-weight="700">Play it in</text>
    <g fill="#1a2226" stroke="#e8c36a">
      <rect x="16" y="680" width="84" height="64" rx="14"/><rect x="106" y="680" width="84" height="64" rx="14"/><rect x="196" y="680" width="84" height="64" rx="14"/><rect x="286" y="680" width="88" height="64" rx="14"/>
      <rect x="16" y="750" width="84" height="64" rx="14"/><rect x="106" y="750" width="84" height="64" rx="14"/><rect x="196" y="750" width="84" height="64" rx="14"/><rect x="286" y="750" width="88" height="64" rx="14"/>
    </g>
    <g fill="#e8c36a" font-size="10"><text x="26" y="700">Kick</text><text x="116" y="700">Snare</text><text x="206" y="700">Clap</text><text x="296" y="700">C hat</text><text x="26" y="770">O hat</text><text x="116" y="770">Perc</text><text x="206" y="770">Rim</text><text x="296" y="770">808</text></g>
  </g>
  <text x="450" y="890" fill="#2a3439" font-size="12">Drum region opened: step grid + pads</text>
</svg>
