# ADR-0261: exactly ONE Machine for this app, no autoscaler or spare Machine.
# Enforce count with `fly scale count 1 --max-per-region 1 -c fly.concat-render.toml`
# and deploy with `--ha=false`. fly.toml has no app-wide maximum-count setting.
# Keep all scaling in ams; see services/concat-render/README.md release procedure.
# No public service: the Worker reaches the wrapper over private networking.
app = "veyrnox-concat-render"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = 120

[build]
  dockerfile = "services/concat-render/Dockerfile"

[deploy]
  strategy = "rolling"
  max_unavailable = 1

[env]
  VK_ICD_FILENAMES = "/usr/share/vulkan/icd.d/lvp_icd.json"

[checks.api]
  type = "tcp"
  port = 8080
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"

[[restart]]
  policy = "on-failure"
  max_retries = 5

# Software rendering is CPU-bound; scale vertically, never add Machines.
[[vm]]
  cpu_kind = "performance"
  cpus = 4
  memory = "8gb"
