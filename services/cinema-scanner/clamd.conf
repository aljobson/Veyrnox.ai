# Private Cinema scanner profile. One worker sends one path at a time.
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
SelfCheck 600

MaxThreads 2
MaxQueue 4
ReadTimeout 900
CommandReadTimeout 30

# Cinema accepts at most 2 GiB. ClamAV's defaults skip files over 100 MiB,
# so these limits must match the admission bound. AlertExceedsMax converts
# every parser/size limit into a non-clean verdict instead of silently
# treating skipped bytes as clean.
MaxScanTime 600000
MaxScanSize 2048M
MaxFileSize 2048M
PCREMaxFileSize 2048M
AlertExceedsMax yes
